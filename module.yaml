name: connect-power-control
title: Connect Power Control
summary: Control and monitor smart plugs (Tasmota, Shelly Gen1/Gen2+, Zigbee2MQTT, ESPHome, OpenBeken, Generic MQTT, and Home Assistant) for printers via MQTT, Direct HTTP, or REST, with active-print power-off protection and auto-off after print.
codeowner: Pixelplanet
kind: sink
version: 0.5.0
license: MIT
contract_major: 1
openapi: openapi.json

require:
  core: ">=0.1.0-beta.1"
  core-device.get: "*"
  core-device.list: "*"
  core-device.jobs: "*"

permissions:
  - observe

needs:
  data: true

options:
  - key: mqtt_host
    type: string
    summary: Hostname or IP address of the MQTT broker.
  - key: http_host
    type: string
    summary: Hostname or IP address of a Tasmota or Shelly smart plug controlled directly over HTTP.
  - key: ha_url
    type: url
    summary: Optional Home Assistant base URL (e.g. http://homeassistant.local:8123) for controlling Home Assistant switch entities.

egress:
  - option: mqtt_host
    ports: [1883, 8883]
    from: process
    why: Connects to the operator's MQTT broker to monitor and switch Tasmota, Shelly, Zigbee2MQTT, ESPHome, OpenBeken, or Generic MQTT smart plugs
    sends: Smart plug power commands and telemetry queries for assigned printer plugs
  - option: http_host
    ports: [80, 443]
    from: process
    why: Polls and switches a Tasmota or Shelly smart plug directly over HTTP when no MQTT broker is used
    sends: Tasmota /cm or Shelly Gen1/Gen2+ HTTP status queries and relay commands
  - option: ha_url
    ports: [8123, 80, 443]
    from: process
    why: Polls switch/power sensor states and calls homeassistant.turn_on/turn_off services when the Home Assistant driver is used
    sends: Authenticated Home Assistant REST API requests for assigned printer switch entities

platforms:
  - linux_amd64
  - linux_arm64
  - darwin_amd64
  - darwin_arm64
  - windows_amd64

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    device_section:
      - id: power-plug
        title: Power Control
    device_card:
      - id: power-status
        title: Power
    settings:
      - id: settings
        title: Settings
